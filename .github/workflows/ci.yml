name: CI

# The D-021 gate suite, machine-enforced. Mirrors the pre-commit hooks
# (docs/09: "same checks, two moments"). A PR cannot merge red.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lockfile in sync (D-014)
        run: uv lock --check

      - name: Install deps
        run: uv sync --locked

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy)
        run: uv run mypy

      - name: Imports (import-linter — layered architecture)
        run: uv run lint-imports

      - name: Tests (unit + integration + system)
        run: uv run pytest

  postgres:
    # D-054: prove the dialect-portable cutover (D-025) by running the same offline suite
    # against Postgres, so SQLite→Postgres stays a verified URL swap and every later block's
    # schema is born-on-Postgres-verified. pytest-only — lint/format/types/imports are
    # dialect-agnostic and already covered by `gates`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Tests on Postgres (unit + integration + system)
        env:
          VJA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vja_test
        run: uv run pytest

  frontend:
    # The D-042 frontend gate: the React dashboard's eslint + tsc + vitest, mirrored in
    # pre-commit (docs/09 "same checks, two moments"). Parallel to the Python `gates` job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Types (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans full history on PRs
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
