# Local mirror of the CI gates (docs/09: same checks, two moments).
# Install once: `uv run pre-commit install`
# Hooks shell out to `uv run` so the versions match the locked dev deps exactly
# — no second source of truth for tool versions.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layered architecture)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (unit + integration + system)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      # Frontend gate (D-042) — mirrors the CI `frontend` job. Runs only when frontend
      # TS/TSX changes are staged; same eslint + tsc + vitest checks, two moments.
      - id: frontend-checks
        name: frontend (eslint + tsc + vitest)
        entry: bash -c 'cd frontend && npm run lint && npm run typecheck && npm run test'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
