[project]
name = "vja"
version = "0.0.1"
description = "Vertical Job Intelligence Agent — scheduled pipeline that diffs a bounded employer universe and emails a reasoned digest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.111.0",
    "httpx>=0.28",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
# CLI entry points get wired here as the pipeline grows (fetch, diff, send).
vja-import-employers = "vja.db.employers:main"
vja-run = "vja.pipeline:run_main"
vja-digest = "vja.digest.send:send_main"
vja-nightly = "vja.nightly:nightly_main"
vja-load-profiles = "vja.verticals:load_profiles_main"
vja-extract = "vja.extract:extract_main"
vja-match = "vja.match:match_main"
vja-backfill = "vja.match:backfill_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "freezegun>=1.5",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vja"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
# Alembic's env.py / versions are generated boilerplate — don't lint-gate them.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# A pragmatic, strict-enough default. Expand deliberately, not reflexively.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Alembic's generated env.py / versions are excluded from strict type-checking.
exclude = ["^migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in tiers (docs/08): default run is unit+integration+system only.
# `live`/`e2e`/`eval` never run in the inner loop or block a merge unless asked.
addopts = "-m 'not live and not e2e and not eval'"
markers = [
    "live: hits real ATS endpoints (opt-in; catches ATS drift, not logic)",
    "e2e: full real pipeline incl. network/LLM/email (opt-in, milestone-only)",
    "eval: pins LLM match/extraction behavior (opt-in; path-filtered CI merge gate)",
]
