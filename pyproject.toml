[project]
name = "vja"
version = "0.0.1"
description = "Vertical Job Intelligence Agent — scheduled pipeline that diffs a bounded employer universe and emails a reasoned digest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "authlib>=1.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.138.0",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "litellm>=1.93.0,<1.94.0",
    "openai>=2.0",
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
# CLI entry points get wired here as the pipeline grows (fetch, diff, send).
vja-import-employers = "vja.db.employers:main"
vja-run = "vja.pipeline:run_main"
vja-digest = "vja.digest.send:send_main"
vja-nightly = "vja.nightly:nightly_main"
vja-load-profiles = "vja.verticals:load_profiles_main"
vja-extract = "vja.extract:extract_main"
vja-match = "vja.match:match_main"
vja-backfill = "vja.match:backfill_main"
vja-api = "vja.api:api_main"
vja-repair = "vja.repair:repair_main"
vja-discover = "vja.discover:main"
vja-review = "vja.review:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "freezegun>=1.5",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "import-linter>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vja"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
# Alembic's env.py / versions are generated boilerplate — don't lint-gate them.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# A pragmatic, strict-enough default. Expand deliberately, not reflexively.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Alembic's generated env.py / versions are excluded from strict type-checking.
exclude = ["^migrations/"]

# Authlib ships no type stubs; trust its surface at the api-layer boundary (auth.py / app.py).
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in tiers (docs/08): default run is unit+integration+system only.
# `live`/`e2e`/`eval` never run in the inner loop; extraction eval is advisory.
addopts = "-m 'not live and not e2e and not eval'"
markers = [
    "live: hits real ATS endpoints (opt-in; catches ATS drift, not logic)",
    "e2e: full real pipeline incl. network/LLM/email (opt-in, milestone-only)",
    "eval: manual/advisory LLM evidence (opt-in/metered; D-090/D-093)",
]

# import-linter: the layered architecture is law, not luck (run: `uv run lint-imports`).
# "Lower layers must not import higher ones" keeps every module readable from its own
# layer down. Enforced in pre-commit + CI alongside ruff/mypy. The current truth this
# encodes lives in docs/INVARIANTS.md (§ Architecture).
[tool.importlinter]
root_package = "vja"

[[tool.importlinter.contracts]]
name = "vja layered architecture (lower layers must not import higher)"
type = "layers"
containers = ["vja"]
layers = [
    "nightly | api | repair",
    "pipeline | extract | match | digest | discover | review",
    "fetchers | verticals | llm",
    "db",
    "prefilter | scope | dates | diff | hashing | resume",
    "models",
]
# Grandfathered back-edge: db.employers reaches up to fetchers.registry for
# SUPPORTED_ATS_TYPES (filters employers to fetchable ATS types). Visible and reviewed,
# not invisible. Candidate cleanup: inject the supported set from the orchestration
# layer instead. Any *new* db -> fetchers edge still fails the build.
ignore_imports = [
    "vja.db.employers -> vja.fetchers.registry",
]
