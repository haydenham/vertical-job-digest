# Vertical config — "a vertical is config" (D-004, docs/06). The Week-4 architecture test (D-002):
# this file + the aviation seed rows + the aviation résumé stand up a whole vertical with no code change.
# The employer list lives in data/seed/employers_seed.csv (filtered by `vertical`);
# this file holds the matching profile, the Stage-A scope rules, and the Stage-B prefilter knobs.
key: aviation_software

matching_profile:
  user_email: haydenham10@gmail.com
  resume: profiles/hayden_aviation_resume.md   # path relative to config/verticals/
  domain_vocabulary:                            # steers the match prompt (5.3)
    - flight operations
    - crew scheduling / rostering
    - air traffic management
    - avionics / flight software
    - flight planning / dispatch systems
    - airline reservations / GDS
    - aircraft maintenance / MRO software
    - ADS-B / flight tracking
    - route / network optimization
    - real-time flight data
    - airline revenue management
    - flight safety systems

# Stage A — free, resume-independent title gate (D-023). Keep a title iff it matches a
# role_include keyword AND no exclude keyword (whole-word, case-insensitive). Tune freely.
scope:
  role_include:
    - software
    - engineer
    - developer
    - data
    - analyst
    - scientist
    - machine learning
    - programmer
    - backend
    - frontend
    - full stack
    - fullstack
    - devops
    - platform
    - infrastructure
    - embedded
  exclude:
    # seniority (we target early-career)
    - senior
    - sr
    - staff
    - principal
    - lead
    - manager
    - director
    - vp
    - vice president
    - head
    - chief
    # non-software roles common on airline / aerospace whole-company boards
    - pilot
    - first officer
    - flight attendant
    - cabin crew
    - ramp
    - baggage
    - gate agent
    - customer service
    - flight instructor
    - mechanic
    - technician
    - machinist
    - welder
    - assembler
    - operator
    - sales
    - marketing
    - recruiter
    - counsel
    - attorney
    - accountant
    - nurse

# Stage B — cheap deterministic pre-filter before the strong model (D-023; consumed in 5.3).
prefilter:
  locations: [US]
  levels: [intern, new_grad, early_career]
